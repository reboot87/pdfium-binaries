name: Build one

on:
  workflow_dispatch:
    inputs:
      branch:
        description: PDFium branch
        required: false
        default: main
      version:
        description: PDFium version
        required: false
        default: ""
      target_os:
        description: Target OS
        type: choice
        options:
          - android
          - emscripten
          - ios
          - linux
          - mac
          - win
      target_cpu:
        description: Target CPU
        type: choice
        options:
          - arm
          - arm64
          - mipsel
          - mips64el
          - ppc64
          - x64
          - x86
          - wasm
      target_environment:
        description: Target environment
        type: choice
        default: ''
        options:
          - ''
          - device
          - catalyst
          - musl
          - simulator
      enable_v8:
        description: Enable V8
        type: boolean
        required: false
        default: false
      enable_skia:
        description: Enable Skia rendering backend
        type: boolean
        required: false
        default: false
      emsdk_version:
        description: Emscripten SDK
        type: string
        required: false
        default: 3.1.72
      is_debug:
        description: Is debug
        type: boolean
        required: false
        default: false
      release:
        description: Publish the artifact to the continuous GitHub Release
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
      actions: write # Trigger reusable workflow and upload artifacts
    uses: ./.github/workflows/build.yml
    secrets:
      MUSL_URL: ${{ secrets.MUSL_URL }}
    with:
      branch: ${{ github.event.inputs.branch }}
      version: ${{ github.event.inputs.version }}
      is_debug: ${{ github.event.inputs.is_debug == 'true' }}
      target_os: ${{ github.event.inputs.target_os }}
      target_cpu: ${{ github.event.inputs.target_cpu }}
      target_environment: ${{ github.event.inputs.target_environment }}
      enable_v8: ${{ github.event.inputs.enable_v8 == 'true' }}
      enable_skia: ${{ github.event.inputs.enable_skia == 'true' }}
      emsdk_version: ${{ github.event.inputs.emsdk_version }}

  publish:
    name: Publish to Release
    if: github.event.inputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package as zip
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/artifacts"
          shopt -s nullglob
          for DIR in pdfium-*/; do
            name="${DIR%/}"
            ( cd "$DIR" && zip -r "$GITHUB_WORKSPACE/${name}.zip" . )
          done
          ls -lh "$GITHUB_WORKSPACE"/pdfium-*.zip
      - name: Publish to continuous Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=continuous
          gh release create "$TAG" --prerelease --title "Rolling build (main)" \
            --notes "Automated Windows builds of PDFium for Windows XP, uploaded per-variant via build-one." 2>/dev/null || true
          gh release upload "$TAG" "$GITHUB_WORKSPACE"/pdfium-*.zip --clobber
