name: Build

on:
  workflow_call:
    inputs:
      branch:
        description: PDFium branch
        type: string
        required: false
        default: main
      version:
        description: PDFium version
        type: string
        required: false
        default: ""
      enable_v8:
        description: Enable V8
        type: boolean
        required: false
        default: false
      is_debug:
        description: Is debug
        type: boolean
        required: false
        default: false
      target_os:
        description: Target OS (android|emscripten|ios|linux|mac|win)
        type: string
        required: true
      target_cpu:
        description: Target (CPU arm|arm64|mipsel|mips64el|ppc64|x64|x86|wasm)
        type: string
        required: true
      target_environment:
        description: Target environment (device|catalyst|musl|simulator)
        type: string
        required: false
        default: ''
      build_type:
        description: Build type (shared|static)
        type: string
        required: false
        default: shared
      emsdk_version:
        description: Emscripten SDK
        type: string
        required: false
        default: 3.1.72
    secrets:
      MUSL_URL:
        description: Optional mirror of musl.cc
        required: false
    outputs:
      artifact:
        description: "The name of the artifact"
        value: ${{ jobs.build.outputs.artifact }}

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    outputs:
      artifact: ${{ steps.init.outputs.artifact }}
    runs-on: ${{ (inputs.target_os == 'ios' || inputs.target_os == 'mac') && 'macos-15' || inputs.target_os == 'win' && 'windows-2022' || 'ubuntu-24.04' }}
    env:
      PDFium_BRANCH: ${{ inputs.branch }}
      PDFium_IS_DEBUG: ${{ inputs.is_debug }}
      PDFium_TARGET_CPU: ${{ inputs.target_cpu }}
      PDFium_TARGET_OS: ${{ inputs.target_os }}
      PDFium_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      PDFium_ENABLE_V8: ${{ inputs.enable_v8 }}
      PDFium_BUILD_TYPE: ${{ inputs.build_type }}
      PDFium_VERSION: ${{ inputs.version }}
      EMSDK_VERSION: ${{ inputs.emsdk_version }}
      MUSL_URL: ${{ secrets.MUSL_URL }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
    steps:
      - name: Initialize
        id: init
        shell: bash
        run: |
          ARTIFACT="pdfium"
          [ "$PDFium_ENABLE_V8" == "true" ] && ARTIFACT="$ARTIFACT-v8"
          [ "$PDFium_TARGET_OS" != "emscripten" ] && ARTIFACT="$ARTIFACT-$PDFium_TARGET_OS"
          [ "$PDFium_TARGET_ENVIRONMENT" != "" ] && ARTIFACT="$ARTIFACT-$PDFium_TARGET_ENVIRONMENT"
          ARTIFACT="$ARTIFACT-$PDFium_TARGET_CPU"
          [ "$PDFium_BUILD_TYPE" == "static" ] && ARTIFACT="$ARTIFACT-static"
          [ "$IS_DEBUG" == "true" ] && ARTIFACT="$ARTIFACT-debug"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
        env:
          IS_DEBUG: ${{ inputs.is_debug }}
      - name: Checkout this repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install v141_xp toolset for Windows XP
        if: ${{ inputs.target_os == 'win' }}
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $paths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional",
            "C:\Program Files\Microsoft Visual Studio\2022\Community"
          )
          $installPath = $null
          foreach ($p in $paths) { if (Test-Path $p) { $installPath = $p; break } }
          if ($vsInstaller -and (Test-Path $vsInstaller) -and $installPath) {
            Write-Host "Installing VC++ v141.xp to $installPath"
            Start-Process -Wait -FilePath $vsInstaller -ArgumentList @("modify", "--installPath", $installPath, "--add", "Microsoft.VisualStudio.Component.VC.v141.xp", "--quiet", "--norestart", "--force")
            Write-Host "Done"
          } else {
            Write-Host "vs_installer or install path not found"
          }
      - name: Set environment variables
        run: steps/00-environment.sh
        shell: bash
      - name: Install (1/2)
        run: steps/01-install.sh
        shell: bash
      - name: Checkout PDFium
        run: steps/02-checkout.sh
        shell: bash
        timeout-minutes: 15
      - name: Apply patches
        run: steps/03-patch.sh
        shell: bash
      - name: Install (2/2)
        run: steps/04-install-extras.sh
        shell: bash
      - name: Setup YY-Thunks for Windows XP
        if: ${{ inputs.target_os == 'win' }}
        shell: pwsh
        run: |
          $yythunksVersion = "1.1.7"
          $arch = if ($env:PDFium_TARGET_CPU -eq "x64") { "x64" } elseif ($env:PDFium_TARGET_CPU -eq "x86") { "x86" } else { "$env:PDFium_TARGET_CPU" }
          $apiUrl = "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$yythunksVersion"
          Write-Host "Fetching release info from $apiUrl"
          $headers = @{ "User-Agent" = "pdfium-binaries-xp" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          $assets = $release.assets
          $asset = $assets | Where-Object { $_.name -match $arch -and $_.name -match '\.zip$' -and $_.name -notmatch 'pdb' -and $_.name -notmatch 'src' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $assets | Where-Object { $_.name -match $arch -and $_.name -match '\.zip$' } | Select-Object -First 1
          }
          if (-not $asset) {
            Write-Host "Assets:" 
            $assets | ForEach-Object { Write-Host $_.name }
            throw "No suitable YY-Thunks zip found for arch $arch"
          }
          $url = $asset.browser_download_url
          Write-Host "Downloading YY-Thunks from $url ($($asset.name))"
          Invoke-WebRequest -Uri $url -OutFile yy-thunks.zip -Headers $headers
          Expand-Archive -Path yy-thunks.zip -DestinationPath yy-thunks -Force
          $libPath = Get-ChildItem -Path yy-thunks -Recurse -Filter "*.lib" | ForEach-Object { $_.DirectoryName } | Where-Object { $_ -match $arch } | Select-Object -First 1
          if (-not $libPath) {
            $libPath = Join-Path $PWD "yy-thunks\\lib\\$arch"
          }
          if (-not (Test-Path $libPath)) {
            $libPath = Join-Path $PWD "yy-thunks\\lib"
          }
          $incPath = Join-Path $PWD "yy-thunks\\include"
          Write-Host "YY-Thunks lib path: $libPath"
          Get-ChildItem $libPath -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          echo "YYTHUNKS_LIB=$libPath" >> $env:GITHUB_ENV
          echo "YYTHUNKS_INCLUDE=$incPath" >> $env:GITHUB_ENV
          echo "LIB=$libPath;$env:LIB" >> $env:GITHUB_ENV
          echo "INCLUDE=$incPath;$env:INCLUDE" >> $env:GITHUB_ENV
      - name: Configure
        run: |
          steps/05-configure.sh
          cat <<END >>$GITHUB_STEP_SUMMARY
          ## args.gn

          \`\`\`gn
          $(cat pdfium/out/args.gn)
          \`\`\`
          END
        shell: bash
      - name: Build
        run: steps/06-build.sh
        shell: bash
      - name: Stage
        run: steps/07-stage.sh
        shell: bash
      - name: Collect licenses
        run: steps/08-licenses.sh
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.init.outputs.artifact }}
          path: staging/
      - name: Test
        run: steps/09-test.sh
        shell: bash
