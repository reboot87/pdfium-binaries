name: Build

on:
  workflow_call:
    inputs:
      branch:
        description: PDFium branch
        type: string
        required: false
        default: main
      version:
        description: PDFium version
        type: string
        required: false
        default: ""
      enable_v8:
        description: Enable V8
        type: boolean
        required: false
        default: false
      enable_skia:
        description: Enable Skia rendering backend
        type: boolean
        required: false
        default: false
      is_debug:
        description: Is debug
        type: boolean
        required: false
        default: false
      target_os:
        description: Target OS (android|emscripten|ios|linux|mac|win)
        type: string
        required: true
      target_cpu:
        description: Target (CPU arm|arm64|mipsel|mips64el|ppc64|x64|x86|wasm)
        type: string
        required: true
      target_environment:
        description: Target environment (device|catalyst|musl|simulator)
        type: string
        required: false
        default: ''
      build_type:
        description: Build type (shared|static)
        type: string
        required: false
        default: shared
      emsdk_version:
        description: Emscripten SDK
        type: string
        required: false
        default: 3.1.72
    secrets:
      MUSL_URL:
        description: Optional mirror of musl.cc
        required: false
    outputs:
      artifact:
        description: "The name of the artifact"
        value: ${{ jobs.build.outputs.artifact }}

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
      actions: write # Upload workflow artifacts
    outputs:
      artifact: ${{ steps.init.outputs.artifact }}
    runs-on: ${{ (inputs.target_os == 'ios' || inputs.target_os == 'mac') && 'macos-15' || inputs.target_os == 'win' && 'windows-2022' || 'ubuntu-24.04' }}
    env:
      PDFium_BRANCH: ${{ inputs.branch }}
      PDFium_IS_DEBUG: ${{ inputs.is_debug }}
      PDFium_TARGET_CPU: ${{ inputs.target_cpu }}
      PDFium_TARGET_OS: ${{ inputs.target_os }}
      PDFium_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      PDFium_ENABLE_V8: ${{ inputs.enable_v8 }}
      PDFium_ENABLE_SKIA: ${{ inputs.enable_skia }}
      PDFium_BUILD_TYPE: ${{ inputs.build_type }}
      PDFium_VERSION: ${{ inputs.version }}
      EMSDK_VERSION: ${{ inputs.emsdk_version }}
      MUSL_URL: ${{ secrets.MUSL_URL }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
    steps:
      - name: Initialize
        id: init
        shell: bash
        run: |
          ARTIFACT="pdfium"
          [ "$PDFium_ENABLE_V8" == "true" ] && ARTIFACT="$ARTIFACT-v8"
          [ "$PDFium_ENABLE_SKIA" == "true" ] && ARTIFACT="$ARTIFACT-skia"
          [ "$PDFium_TARGET_OS" != "emscripten" ] && ARTIFACT="$ARTIFACT-$PDFium_TARGET_OS"
          [ "$PDFium_TARGET_ENVIRONMENT" != "" ] && ARTIFACT="$ARTIFACT-$PDFium_TARGET_ENVIRONMENT"
          ARTIFACT="$ARTIFACT-$PDFium_TARGET_CPU"
          [ "$PDFium_BUILD_TYPE" == "static" ] && ARTIFACT="$ARTIFACT-static"
          [ "$IS_DEBUG" == "true" ] && ARTIFACT="$ARTIFACT-debug"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
        env:
          IS_DEBUG: ${{ inputs.is_debug }}
      - name: Checkout this repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set environment variables
        run: steps/00-environment.sh
        shell: bash
      - name: Install (1/2)
        run: steps/01-install.sh
        shell: bash
      - name: Checkout PDFium
        run: steps/02-checkout.sh
        shell: bash
        timeout-minutes: 15
      - name: Apply patches
        run: steps/03-patch.sh
        shell: bash
      - name: Install (2/2)
        run: steps/04-install-extras.sh
        shell: bash
      - name: Setup YY-Thunks for Windows XP
        if: ${{ inputs.target_os == 'win' }}
        shell: pwsh
        run: |
          # YY-Thunks folder names are the minimum supported Windows version:
          # 5.1.2600.0 is Windows XP, 5.2.3790.1830 is Windows XP x64 / Server 2003.
          if ($env:PDFium_TARGET_CPU -eq "x86") {
            $minOs = "5.1.2600.0"
            $arch = "x86"
            $subsystem = "5.01"
          } elseif ($env:PDFium_TARGET_CPU -eq "x64") {
            $minOs = "5.2.3790.1830"
            $arch = "x64"
            $subsystem = "5.02"
          } else {
            throw "Windows XP support is only available for x86 and x64, not $env:PDFium_TARGET_CPU"
          }

          $yythunksVersion = "1.1.7"
          $headers = @{ "User-Agent" = "pdfium-binaries-xp" }
          $apiUrl = "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$yythunksVersion"
          Write-Host "Fetching release info from $apiUrl"
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'YY-Thunks-Lib.zip' } | Select-Object -First 1
          if (-not $asset) {
            Write-Host "Assets:"
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "YY-Thunks-Lib.zip not found in release v$yythunksVersion"
          }

          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile yy-thunks.zip -Headers $headers
          Expand-Archive -Path yy-thunks.zip -DestinationPath yy-thunks -Force

          $libDir = Join-Path $PWD "yy-thunks\Lib\$minOs\$arch"
          if (-not (Test-Path $libDir)) {
            Write-Host "Available lib directories:"
            Get-ChildItem "$PWD\yy-thunks\Lib" -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "YY-Thunks library directory not found: $libDir"
          }

          # The CRT entry point object is a member of the import libraries, so it
          # is only reported here for troubleshooting, never linked separately.
          $obj = Get-ChildItem $libDir -Filter "YY_Thunks_for_*.obj" | Select-Object -First 1

          Write-Host "YY-Thunks library directory: $libDir"
          Write-Host "YY-Thunks entry object: $($obj.FullName)"
          Get-ChildItem $libDir -Filter "*.lib" | ForEach-Object { Write-Host "  $($_.Name)" }

          echo "YYTHUNKS_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "YYTHUNKS_SDK_ARCH=$arch" >> $env:GITHUB_ENV
          echo "YYTHUNKS_SUBSYSTEM=$subsystem" >> $env:GITHUB_ENV
          echo "LIB=$libDir;$env:LIB" >> $env:GITHUB_ENV
      - name: Configure Windows XP link (YY-Thunks)
        if: ${{ inputs.target_os == 'win' }}
        run: steps/04b-yy-thunks.sh
        shell: bash
      - name: Configure
        run: |
          steps/05-configure.sh
          cat <<END >>$GITHUB_STEP_SUMMARY
          ## args.gn

          \`\`\`gn
          $(cat pdfium/out/args.gn)
          \`\`\`
          END
        shell: bash
      - name: Build
        run: steps/06-build.sh
        shell: bash
      - name: Verify Windows XP compatibility
        if: ${{ inputs.target_os == 'win' }}
        run: steps/07a-xp-check.sh
        shell: bash
      - name: Stage
        run: steps/07-stage.sh
        shell: bash
      - name: Collect licenses
        run: steps/08-licenses.sh
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.init.outputs.artifact }}
          path: staging/
      - name: Test
        run: steps/09-test.sh
        shell: bash
